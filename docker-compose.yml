services:
  mysql:
    image: mysql:8.4
    container_name: expense-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_tracker
      MYSQL_USER: expense_user
      MYSQL_PASSWORD: expense_password
    ports:
      - "3307:3306"
    volumes:
      - expense_mysql_data:/var/lib/mysql

volumes:
  expense_mysql_data: